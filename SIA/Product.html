<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product · Step 'N Kicks</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script src="cart.js"></script>
<script src="products.js"></script>
<style>
:root{--bg:#121212;--card:#232326;--navy:#05051a;--navy2:#14143d;--blue:#1565c0;--blue2:#0a4fe0;--link:#6ea8ff;--muted:#a8a8b3;--text:#fff;--bd:#33333a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Lato","Helvetica Neue",Arial,sans-serif;font-size:13px;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
.promo{background:var(--navy);text-align:center;font-size:11px;color:var(--muted);padding:7px}
.promo b{color:#fff}
header{display:flex;justify-content:flex-start;font-size:13px;align-items:center;gap:24px;padding:14px 28px;border-bottom:1px solid #222;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font:900 16px "Arial Black",Arial,sans-serif;line-height:1;color:#fff}
.brand small{display:block;font:700 5px Arial;letter-spacing:2px;margin-top:3px}
nav{display:flex;gap:20px;font-size:12px}
nav a{color:var(--muted)}
nav a:hover{color:#fff}
.icons{display:flex;gap:14px;font-size:16px;margin-left:auto}
.wrap{max-width:1180px;width:100%;margin:0 auto;padding:18px 28px 40px;flex:1}
.crumb{font-size:10px;color:var(--muted);margin-bottom:18px}
.crumb a:hover{color:var(--text)}
.main{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:start}
.gal{background:#fff;border-radius:12px;border:1px solid var(--bd);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:contain;padding:28px;mix-blend-mode:multiply}
.gal svg{width:80%;height:auto}
.badge{position:absolute;top:14px;left:14px;background:var(--navy);color:#fff;font-size:10px;padding:4px 9px;border-radius:4px}
.badge.red{background:#c62828}
.brandn{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.5px}
.rate{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.stars{color:#f5a623;letter-spacing:1px}
.rate a{color:var(--link)}
.price{font-size:26px;font-weight:700;margin:16px 0 4px}
.meta{color:var(--muted);font-size:12px}
.sec{border-top:1px solid var(--bd);margin-top:20px;padding-top:18px}
.sec h3{font-size:12px;margin:0 0 10px;display:flex;justify-content:space-between}
.sec h3 span{color:var(--muted);font-weight:400;font-size:10px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sizes button{background:var(--card);border:1px solid var(--bd);color:var(--text);border-radius:6px;padding:10px 0;font-size:12px}
.sizes button:hover{border-color:var(--blue2)}
.sizes button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.qty{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.qty button{width:34px;height:34px;background:none;border:0;color:var(--text);font-size:16px}
.qty button:hover{background:var(--card)}
.qty span{min-width:34px;text-align:center;font-size:13px}
.acts{display:flex;gap:12px;margin-top:22px}
.acts button{flex:1;height:46px;border-radius:6px;font-weight:700;font-size:12px}
.add{background:none;border:1.5px solid var(--blue2);color:var(--text)}
.add:hover{background:var(--card)}
.buy{background:var(--blue);border:0;color:#fff}
.buy:hover{background:#1976d2}
.acts button:disabled{opacity:.5;cursor:not-allowed}
.perks{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:11px;color:var(--muted)}
.auth{color:var(--link)}
/* details + reviews */
.below{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;margin-top:36px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:22px}
.box h2{font-size:16px;margin:0 0 12px}
.box p{margin:0 0 14px;color:var(--muted);line-height:1.7;font-size:12px}
.box ul{margin:0 0 16px;padding-left:18px;color:var(--text);font-size:12px;line-height:1.9}
.dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12px;border-top:1px solid var(--bd);padding-top:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.sum{display:flex;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.sum b{font-size:38px;line-height:1}
.sum .stars{font-size:15px;display:block;margin-bottom:3px}
.rv{padding:16px 0;border-top:1px solid var(--bd)}
.sum+.rv{border-top:0}
.rv .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rv .top b{font-size:12px}
.rv .top span{font-size:10px;color:var(--muted)}
.rv p{margin:6px 0 0;color:var(--text);font-size:12px;line-height:1.6}
.ver{font-size:9px;color:#9be3b5;margin-left:8px}
.nf{text-align:center;padding:80px 0}
.nf a{color:var(--link)}
footer{padding:22px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:10px;color:var(--muted);background:var(--navy)}
footer div{display:flex;gap:20px}
@media(max-width:900px){.main,.below{grid-template-columns:1fr}nav{display:none}}
@media(max-width:560px){header{padding:12px 16px}.wrap{padding:16px}.acts{flex-direction:column}h1{font-size:24px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="lo" viewBox="0 0 200 100"><path d="M12 74 Q12 86 26 86 L172 86 Q192 86 192 72 L192 68 L12 68Z" fill="var(--s,#fff)" stroke="#0003"/><path d="M14 70 L16 42 Q17 34 27 33 L48 31 Q60 22 72 14 L88 22 Q106 30 122 36 Q154 40 174 54 Q192 60 192 70Z" fill="currentColor" stroke="#0003"/><path d="M146 46 Q184 54 192 70 L146 70Z" fill="#0000001a"/><path d="M66 36 Q88 52 102 70 L115 70 Q100 48 80 34Z M90 36 Q108 50 118 70 L128 70 Q118 46 100 33Z" fill="var(--a)"/><path d="M15 52 Q32 50 42 62 L15 70Z" fill="var(--a)"/><path d="M76 20 l9 5 M86 25 l9 5 M96 30 l9 5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="hi" viewBox="0 0 200 100"><path d="M12 74 Q12 86 26 86 L172 86 Q192 86 192 72 L192 70 L12 70Z" fill="var(--s,#fff)" stroke="#0003"/><path d="M16 72 L20 14 Q22 8 30 8 L66 8 L72 30 Q100 40 126 46 Q172 50 190 62 Q194 70 190 72Z" fill="currentColor" stroke="#0003"/><path d="M150 50 Q184 54 192 66 Q192 74 184 74 L150 74Z" fill="var(--a)"/><circle cx="38" cy="46" r="7" fill="var(--a)" opacity=".9"/><path d="M62 14 l12 5 M64 24 l12 5 M72 34 l12 5 M86 41 l12 5" stroke="var(--a)" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="bb" viewBox="0 0 200 100"><path d="M10 72 Q10 90 28 90 L170 90 Q194 90 194 74 L194 66 L10 66Z" fill="var(--s,#fff)" stroke="#0003"/><path d="M14 68 L18 24 Q20 12 34 12 L66 14 L74 32 Q110 40 134 46 Q176 50 192 62 L194 68Z" fill="currentColor" stroke="#0003"/><path d="M18 50 Q60 44 80 60 L84 68 L16 68Z" fill="var(--a)" opacity=".9"/><path d="M84 34 Q110 50 126 68 L140 68 Q124 46 98 32Z" fill="var(--a)"/><path d="M64 18 l12 5 M68 27 l12 5 M78 35 l12 5" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M10 78 H194" stroke="var(--a)" stroke-width="3"/></symbol>
<symbol id="run" viewBox="0 0 200 100"><path d="M10 70 Q10 90 30 90 L170 90 Q194 90 194 76 L194 70 Q150 78 10 70Z" fill="var(--s,#fff)" stroke="#0003"/><path d="M14 72 L18 38 Q20 28 32 28 L52 26 Q62 20 74 18 L90 26 Q118 36 140 44 Q184 52 194 70 Q150 80 14 72Z" fill="currentColor" stroke="#0003"/><path d="M30 56 Q70 40 112 62 L108 70 Q70 58 30 66Z" fill="var(--a)"/><path d="M126 48 Q168 54 190 68 L150 70Z" fill="#ffffff30"/><path d="M72 24 l8 4 M82 29 l8 4 M92 33 l8 4" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M10 80 Q100 86 194 78" stroke="var(--a)" stroke-width="3" fill="none"/></symbol>
<symbol id="clog" viewBox="0 0 200 100"><path d="M12 76 Q12 90 28 90 L170 90 Q192 90 192 76 L192 72 L12 72Z" fill="var(--s,#c9a56b)" stroke="#0003"/><path d="M14 74 Q14 36 40 32 Q74 30 100 40 Q150 44 182 60 Q194 66 192 74Z" fill="currentColor" stroke="#0003"/><path d="M92 36 Q108 20 130 30 L126 50Z" fill="var(--a)"/><rect x="104" y="30" width="14" height="12" rx="2" fill="none" stroke="#ddd" stroke-width="2"/><path d="M16 74 Q60 62 130 66" stroke="#0003" stroke-width="2" fill="none"/></symbol>
<symbol id="slide" viewBox="0 0 200 100"><path d="M14 76 Q14 92 30 92 L172 92 Q192 92 192 76 L192 70 L14 70Z" fill="var(--s,#c9a56b)" stroke="#0003"/><path d="M14 72 Q14 62 30 62 L170 62 Q192 62 192 72 L192 74 L14 74Z" fill="var(--a)"/><path d="M50 62 Q50 36 82 34 Q116 34 124 62Z" fill="currentColor" stroke="#0003"/><path d="M118 62 Q124 44 150 46 Q176 50 184 64Z" fill="currentColor" stroke="#0003"/><rect x="94" y="40" width="12" height="10" rx="2" fill="#d9d9d9" stroke="#888"/><rect x="146" y="48" width="10" height="9" rx="2" fill="#d9d9d9" stroke="#888"/></symbol></svg>

<div class="promo">Free shipping on orders over <b>₱5,000</b> &bull; Authenticity guaranteed on every pair</div>
<header>
  <a class="brand" href="shop.html">STEP 'N KICKS<small>SHOES • BUY • SELL</small></a>
  <nav><a href="shop.html">Shop all</a><a href="#">New arrivals</a><a href="#">Brands</a><a href="#">Sale</a></nav>
  <div class="icons"><a href="account.html" aria-label="My account"><img class="ico d" src="accountdarkmode.png" alt=""><img class="ico l" src="accountlightmode.png" alt=""></a><a href="orders.html" aria-label="My orders"><img class="ico d" src="orderdarkmode.png" alt=""><img class="ico l" src="orderlightmode.png" alt=""></a><a href="settings.html" aria-label="Settings"><img class="ico d" src="settingsdarkmode.png" alt=""><img class="ico l" src="settingslightmode.png" alt=""></a><a class="cartlnk" href="cart.html" aria-label="Cart"><img class="ico d" src="cartdarkmode.png" alt=""><img class="ico l" src="cartlightmode.png" alt=""><span class="cn hide"></span></a></div>
</header>

<div class="wrap" id="app"></div>

<footer><span>© 2026 Step 'N Kicks. All rights reserved.</span><div><a href="#">About us</a><a href="#">Contact us</a><a href="#">Shipping &amp; returns</a><a href="#">Size guide</a></div></footer>

<script>
const $=id=>document.getElementById(id);
const peso=n=>"₱"+n.toLocaleString("en-PH");
const SIZES=[6,7,8,9,10,11,12,13];
const stars=r=>"★".repeat(Math.round(r))+"☆".repeat(5-Math.round(r));
const pic=x=>x.img?`<img src="${x.img}" alt="${x.n}">`:`<svg viewBox="0 0 200 100" style="color:${x.col};--a:${x.a};--s:${x.s}"><use href="#${x.d}"/></svg>`;

const idx=P.findIndex(x=>x.n===new URLSearchParams(location.search).get("n"));
const x=P[idx];
let size=9,qty=1;

if(!x){
  document.title="Product not found · Step 'N Kicks";
  $("app").innerHTML=`<div class="nf"><h1>We couldn't find that pair</h1><p class="meta">It may have been removed.</p><a href="shop.html">← Back to shop</a></div>`;
}else{
  document.title=x.b+" "+x.n+" · Step 'N Kicks";
  const D=PD[x.n]||{d:"",f:[],rv:[]};
  const color=x.m.split("•").pop().trim(),fit=x.m.split("•")[0].trim();
  $("app").innerHTML=`
  <div class="crumb"><a href="shop.html">Home</a> › <a href="shop.html">${x.c}</a> › ${x.n}</div>
  <div class="main">
    <div class="gal">${pic(x)}${x.tag?`<span class="badge ${x.red?"red":""}">${x.tag}</span>`:""}</div>
    <div>
      <span class="brandn">${x.b}</span>
      <h1>${x.n}</h1>
      <div class="rate"><span class="stars">${stars(x.r)}</span><b style="color:var(--text)">${x.r}</b>${D.rv.length?`<a href="#reviews">${D.rv.length} reviews</a>`:""}</div>
      <div class="price">${peso(x.p)}</div>
      <div class="meta">${x.m}</div>
      ${x.out?"":`
      <div class="sec"><h3>Size (US)<span>Select one</span></h3><div class="sizes" id="sizes">${SIZES.map(s=>`<button type="button" data-s="${s}" class="${s===size?"on":""}">${s}</button>`).join("")}</div></div>
      <div class="sec"><h3>Quantity</h3><div class="qty"><button type="button" id="dec" aria-label="Decrease">−</button><span id="qv">1</span><button type="button" id="inc" aria-label="Increase">+</button></div></div>`}
      <div class="acts">
        ${x.out?`<button class="buy" id="notify" type="button">Notify me when available</button>`
               :`<button class="add" id="add" type="button">Add to cart</button><button class="buy" id="buy" type="button">Buy now</button>`}
      </div>
      <div class="perks"><span class="auth">✔ 100% authentic</span><span>🚚 Nationwide delivery</span><span>↩ Easy returns within 7 days</span></div>
    </div>
  </div>

  <div class="below">
    <div class="box">
      <h2>Product details</h2>
      <p>${D.d}</p>
      ${D.f.length?`<ul>${D.f.map(f=>`<li>${f}</li>`).join("")}</ul>`:""}
      <dl class="dl"><dt>Brand</dt><dd>${x.b}</dd><dt>Category</dt><dd>${x.c}</dd><dt>Fit</dt><dd>${fit}</dd><dt>Color</dt><dd>${color}</dd><dt>Availability</dt><dd>${x.out?"Sold out":"In stock"}</dd></dl>
    </div>
    <div class="box" id="reviews">
      <h2>Customer reviews</h2>
      ${D.rv.length?`<div class="sum"><b>${x.r}</b><div><span class="stars">${stars(x.r)}</span><span class="meta">Based on ${D.rv.length} reviews</span></div></div>
      ${D.rv.map(r=>`<div class="rv"><div class="top"><div><b>${r[0]}</b><span class="ver">✔ Verified buyer</span></div><span>${r[2]}</span></div><span class="stars">${stars(r[1])}</span><p>${r[3]}</p></div>`).join("")}`
      :`<p>No reviews yet.</p>`}
    </div>
  </div>`;

  if(!x.out){
    $("sizes").addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      size=+b.dataset.s;
      document.querySelectorAll("#sizes button").forEach(s=>s.classList.toggle("on",s===b));
    });
    const setQ=n=>{qty=Math.min(10,Math.max(1,n));$("qv").textContent=qty};
    $("dec").addEventListener("click",()=>setQ(qty-1));
    $("inc").addEventListener("click",()=>setQ(qty+1));
    $("add").addEventListener("click",()=>{
      SNKCart.add({n:x.n,b:x.b,img:x.img||"",d:x.d||"",a:x.a||"",s:x.s||"",col:x.col,m:x.m,p:x.p,size,qty});
      toast(qty+" × "+x.n+" added to cart");
    });
    $("buy").addEventListener("click",()=>{
      location.href=`shop.html?buy=${idx}&size=${size}&qty=${qty}`;
    });
  }else{
    $("notify").addEventListener("click",()=>alert("We'll notify you when this pair is back in stock."));
  }
}

function toast(t){
  let e=$("toast");
  if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}
  e.textContent=t;e.className="show";
  clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",1800);
}
</script>
</body>
</html>
