<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product · Step 'N Kicks</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script src="cart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<script src="products.js"></script>
<style>
:root{--bg:#121212;--card:#232326;--navy:#05051a;--navy2:#14143d;--blue:#1565c0;--blue2:#0a4fe0;--link:#6ea8ff;--muted:#a8a8b3;--text:#fff;--bd:#33333a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Lato","Helvetica Neue",Arial,sans-serif;font-size:13px;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
.promo{background:var(--navy);text-align:center;font-size:11px;color:var(--muted);padding:7px}
.promo b{color:#fff}
header{display:flex;justify-content:flex-start;font-size:13px;align-items:center;gap:24px;padding:14px 28px;border-bottom:1px solid #222;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font:900 16px "Arial Black",Arial,sans-serif;line-height:1;color:#fff}
.brand small{display:block;font:700 5px Arial;letter-spacing:2px;margin-top:3px}
nav{display:flex;gap:20px;font-size:12px}
nav a{color:var(--muted)}
nav a:hover{color:#fff}
.icons{display:flex;gap:14px;font-size:16px;margin-left:auto}
.wrap{max-width:1180px;width:100%;margin:0 auto;padding:18px 28px 40px;flex:1}
.crumb{font-size:10px;color:var(--muted);margin-bottom:18px}
.crumb a:hover{color:var(--text)}
.main{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:start}
.gal{background:#fff;border-radius:12px;border:1px solid var(--bd);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:contain;padding:28px;mix-blend-mode:multiply}
.gal svg{width:80%;height:auto}
.badge{position:absolute;top:14px;left:14px;background:var(--navy);color:#fff;font-size:10px;padding:4px 9px;border-radius:4px}
.badge.red{background:#c62828}
.brandn{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.5px}
.rate{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.stars{color:#f5a623;letter-spacing:1px}
.rate a{color:var(--link)}
.price{font-size:26px;font-weight:700;margin:16px 0 4px}
.meta{color:var(--muted);font-size:12px}
.sec{border-top:1px solid var(--bd);margin-top:20px;padding-top:18px}
.sec h3{font-size:12px;margin:0 0 10px;display:flex;justify-content:space-between}
.sec h3 span{color:var(--muted);font-weight:400;font-size:10px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sizes button{background:var(--card);border:1px solid var(--bd);color:var(--text);border-radius:6px;padding:10px 0;font-size:12px}
.sizes button:hover{border-color:var(--blue2)}
.sizes button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.qty{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.qty button{width:34px;height:34px;background:none;border:0;color:var(--text);font-size:16px}
.qty button:hover{background:var(--card)}
.qty span{min-width:34px;text-align:center;font-size:13px}
.acts{display:flex;gap:12px;margin-top:22px}
.acts button{flex:1;height:46px;border-radius:6px;font-weight:700;font-size:12px}
.add{background:none;border:1.5px solid var(--blue2);color:var(--text)}
.add:hover{background:var(--card)}
.buy{background:var(--blue);border:0;color:#fff}
.buy:hover{background:#1976d2}
.acts button:disabled{opacity:.5;cursor:not-allowed}
.perks{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:11px;color:var(--muted)}
.auth{color:var(--link)}

/* Details & Reviews */
.below{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;margin-top:36px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:22px}
.box h2{font-size:16px;margin:0 0 12px}
.box p{margin:0 0 14px;color:var(--muted);line-height:1.7;font-size:12px}
.box ul{margin:0 0 16px;padding-left:18px;color:var(--text);font-size:12px;line-height:1.9}
.dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12px;border-top:1px solid var(--bd);padding-top:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.sum{display:flex;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.sum b{font-size:38px;line-height:1}
.sum .stars{font-size:15px;display:block;margin-bottom:3px}
.rv{padding:16px 0;border-top:1px solid var(--bd);position:relative}
.sum+.rv{border-top:0}
.rv .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rv .top b{font-size:12px}
.rv .top span{font-size:10px;color:var(--muted)}
.rv p{margin:6px 0 0;color:var(--text);font-size:12px;line-height:1.6}
.rv-details{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--muted);background:var(--bg);padding:8px 12px;border-radius:6px;border:1px solid var(--bd)}
.rv-details div span{color:var(--text);font-weight:700}
.rv-shop-ratings{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:6px;margin-top:8px;font-size:10px;color:var(--muted);background:rgba(255,255,255,0.02);padding:8px 12px;border-radius:6px;border:1px solid var(--bd)}
.rv-shop-ratings div span{color:#f5a623}
.rv-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rv-photos img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--bd)}
.rv-acts{display:flex;gap:12px;margin-top:12px}
.rv-acts button{background:none;border:0;color:var(--link);font-size:11px;padding:0;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.rv-acts button.del{color:#ff8a8a}
.rv-acts button:hover{text-decoration:underline}
.ver{font-size:9px;color:#9be3b5;margin-left:8px}

/* Review Form Styling */
.rv-form-box{margin-top:20px;padding-top:18px;border-top:1px solid var(--bd)}
.rv-form-box h3{font-size:14px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.star-input{display:inline-flex;gap:4px;cursor:pointer;font-size:22px;color:var(--bd);flex-direction:row-reverse;justify-content:flex-end}
.star-input input{display:none}
.star-input label{cursor:pointer;color:var(--bd)}
.star-input input:checked ~ label, .star-input label:hover, .star-input label:hover ~ label{color:#f5a623}
.rv-field{margin-bottom:12px}
.rv-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.rv-field input[type="text"], .rv-field select, .rv-field textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:#fff;padding:8px 12px;font:inherit;font-size:12px;outline:none}
.rv-field textarea{resize:vertical;min-height:70px}
.rv-field input:focus, .rv-field select:focus, .rv-field textarea:focus{border-color:var(--blue2)}
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Anonymous Switch */
.sw-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:10px 12px;border-radius:6px;border:1px solid var(--bd);margin-bottom:12px}
.sw-row span{font-size:11px;color:var(--text)}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span.slider{position:absolute;inset:0;border-radius:999px;background:#3a3a42;transition:background .15s}
.sw span.slider::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span.slider{background:var(--blue)}
.sw input:checked+span.slider::after{transform:translateX(18px)}

/* Multi-photo upload UI */
.file-upload-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px dashed var(--bd);border-radius:6px;padding:10px 14px;color:var(--link);font-size:12px;cursor:pointer;width:100%;justify-content:center}
.file-upload-btn:hover{border-color:var(--blue2);background:var(--card)}
.file-upload-btn input[type="file"]{display:none}
.photo-previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo-thumb{position:relative;width:60px;height:60px;border-radius:6px;overflow:hidden;border:1px solid var(--bd)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb .rm-photo{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.7);color:#ff8a8a;border:0;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

.submit-rv{background:var(--blue);color:#fff;border:0;padding:10px 18px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;margin-top:8px}
.submit-rv:hover{background:#1976d2}

/* Modal Popups */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(3px)}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;max-width:360px;width:100%;padding:22px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.5);transform:scale(0.95);transition:transform .2s}
.modal-overlay.show .modal-card{transform:scale(1)}
.modal-card h3{margin:0 0 8px;font-size:16px}
.modal-card p{color:var(--muted);font-size:12px;margin:0 0 20px;line-height:1.5}
.modal-btns{display:flex;gap:10px;justify-content:center}
.modal-btns button{flex:1;height:36px;border-radius:6px;font-weight:700;font-size:11px;border:0;cursor:pointer}
.modal-btns .btn-cancel{background:var(--bg);border:1px solid var(--bd);color:var(--text)}
.modal-btns .btn-del{background:#c62828;color:#fff}
.modal-btns .btn-del:hover{background:#e53935}

/* Edit Review Modal Overrides */
.edit-modal-card{max-width:540px;width:100%;max-height:88vh;overflow-y:auto;text-align:left;padding:24px;position:relative}
.edit-modal-card .close-edit{position:absolute;top:16px;right:16px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.edit-modal-card .close-edit:hover{color:#fff}
.edit-modal-card h3{margin:0 0 16px;font-size:18px;border-bottom:1px solid var(--bd);padding-bottom:12px}

.nf{text-align:center;padding:80px 0}
.nf a{color:var(--link)}
footer{padding:22px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:10px;color:var(--muted);background:var(--navy)}
footer div{display:flex;gap:20px}
@media(max-width:900px){.main,.below{grid-template-columns:1fr}nav{display:none}}
@media(max-width:560px){header{padding:12px 16px}.wrap{padding:16px}.acts{flex-direction:column}h1{font-size:24px}.rv-grid{grid-template-columns:1fr}}
</style>
</head>

<div class="wrap" id="app"></div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="delModal">
  <div class="modal-card">
    <h3>Delete Review?</h3>
    <p>This action cannot be undone. Are you sure you want to remove this review?</p>
    <div class="modal-btns">
      <button type="button" class="btn-cancel" id="confirmCancel">Cancel</button>
      <button type="button" class="btn-del" id="confirmDelete">Delete</button>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id),esc=SNKEsc;
const peso=n=>"₱"+n.toLocaleString("en-PH");
const SIZES=[6,7,8,9,10,11,12,13];
const stars=r=>{r=Math.round(r);return "★".repeat(r)+"☆".repeat(5-r)};
const pic=x=>x.img?`<img src="${esc(x.img)}" alt="${esc(x.n)}">`:`<svg viewBox="0 0 200 100" style="color:${esc(x.col)};--a:${esc(x.a)};--s:${esc(x.s)}"><use href="#${esc(x.d||"lo")}"/></svg>`;
function toast(t){
  let e=$("toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}
  e.textContent=t;e.className="show";clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",2200);
}
let x=null,size=null,qty=1,me=null,revs=[],canReview=false,delId=null;

function find(){
  const q=new URLSearchParams(location.search),id=q.get("id"),n=q.get("n");
  return P.find(p=>id!==null?String(p.id)===id:p.n===n)||null;
}
function details(x){   // description: database text, else the text in products.js, else a plain fallback
  const k=Object.keys(PD).find(n=>n.toLowerCase()===x.n.toLowerCase()),D=k?PD[k]:null;
  return {d:x.desc||(D&&D.d)||(x.b+" "+x.n+" — "+x.c+" from Step 'N Kicks."),f:(D&&D.f)||[]};
}
function seo(x,D,avg,n){
  const old=document.getElementById("ld");if(old)old.remove();
  const ld={"@context":"https://schema.org","@type":"Product",name:x.n,brand:{"@type":"Brand",name:x.b},description:D.d,
    offers:{"@type":"Offer",priceCurrency:"PHP",price:x.p,availability:x.out?"https://schema.org/OutOfStock":"https://schema.org/InStock"}};
  if(x.img)ld.image=new URL(x.img,location.href).href;
  if(n)ld.aggregateRating={"@type":"AggregateRating",ratingValue:avg,reviewCount:n};
  const sc=document.createElement("script");sc.type="application/ld+json";sc.id="ld";sc.textContent=JSON.stringify(ld);document.head.appendChild(sc);
  const m=document.querySelector('meta[name="description"]');if(m)m.content=(D.d||"").slice(0,155);
}
const starInput=(name,pre)=>[5,4,3,2,1].map(v=>`<input type="radio" id="${pre}${v}" name="${name}" value="${v}" ${v===5?"required":""}><label for="${pre}${v}">★</label>`).join("");

function draw(){
  if(x&&x.stock!=null&&x.stock>0)qty=Math.min(qty,x.stock);
  if(!x){
    document.title="Product not found · Step 'N Kicks";
    $("app").innerHTML=`<div class="nf"><h1>We couldn't find that pair</h1><p class="meta">It may have been removed.</p><a href="shop.html">← Back to shop</a></div>`;return;
  }
  document.title=x.b+" "+x.n+" · Step 'N Kicks";
  const D=details(x),n=revs.length,avg=n?(revs.reduce((s,r)=>s+r.rating,0)/n).toFixed(1):0;
  const color=String(x.m).split("•").pop().trim(),fit=String(x.m).split("•")[0].trim();
  const mine=me?revs.find(r=>r.user_id===me.id):null;
  let form;
  if(!me)form=`<p class="meta">Only customers who received this pair can review it. <a href="index.html?next=${encodeURIComponent(location.pathname.split("/").pop()+location.search)}" style="color:var(--link)">Log in</a> to continue.</p>`;
  else if(!canReview)form=`<p class="meta">You can review this pair after your order has been delivered.</p>`;
  else form=`<form class="rv-form-box" id="rvForm">
    <h3>${mine?"Edit your review":"Write a review"}</h3>
    <div class="sw-row"><span>Show my name on this review</span><label class="sw"><input type="checkbox" id="rvShow" ${mine&&mine.public_name?"checked":""}><span class="slider"></span></label></div>
    <div class="rv-field"><label>Overall rating</label><div class="star-input">${starInput("rating","st")}</div></div>
    <div class="rv-field"><label for="rvFit">Fit</label><select id="rvFit"><option>True to size</option><option>Runs small</option><option>Runs large</option></select></div>
    <div class="rv-field"><label for="rvComment">Your review</label><textarea id="rvComment" maxlength="1000" placeholder="Share your experience with this pair..." required>${esc(mine?mine.comment:"")}</textarea></div>
    <button type="submit" class="submit-rv">${mine?"Update review":"Submit review"}</button><div class="meta" id="rvErr" style="color:#c62828;margin-top:6px"></div></form>`;
  $("app").innerHTML=`
  <div class="crumb"><a href="shop.html">Home</a> › <a href="shop.html">${esc(x.c)}</a> › ${esc(x.n)}</div>
  <div class="main">
    <div class="gal">${pic(x)}${x.tag?`<span class="badge ${x.red?"red":""}">${esc(x.tag)}</span>`:""}</div>
    <div>
      <span class="brandn">${esc(x.b)}</span><h1>${esc(x.n)}</h1>
      <div class="rate"><span class="stars">${n?stars(avg):"☆☆☆☆☆"}</span><b style="color:var(--text)">${n?avg:"No ratings yet"}</b>${n?`<a href="#reviews">${n} review${n>1?"s":""}</a>`:""}</div>
      <div class="price">${peso(x.p)}</div><div class="meta">${esc(x.m)}</div>
      ${x.out?"":`
      <div class="sec"><h3>Size (US)<span>Select one</span></h3><div class="sizes" id="sizes">${SIZES.map(s=>`<button type="button" data-s="${s}" class="${s===size?"on":""}">${s}</button>`).join("")}</div></div>
      <div class="sec"><h3>Quantity</h3><div class="qty"><button type="button" id="dec" aria-label="Decrease">−</button><span id="qv">${qty}</span><button type="button" id="inc" aria-label="Increase">+</button></div></div>`}
      <div class="acts">${x.out?`<button class="buy" id="notify" type="button">Notify me when available</button>`
        :`<button class="add" id="add" type="button">Add to cart</button><button class="buy" id="buy" type="button">Buy now</button>`}</div>
      <div class="perks"><span class="auth">✔ 100% authentic</span><span>🚚 Nationwide delivery</span><span>↩ Easy returns within 7 days</span></div>
    </div>
  </div>
  <div class="below">
    <div class="box"><h2>Product details</h2><p>${esc(D.d)}</p>${D.f.length?`<ul>${D.f.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
      <dl class="dl"><dt>Brand</dt><dd>${esc(x.b)}</dd><dt>Category</dt><dd>${esc(x.c)}</dd><dt>Fit</dt><dd>${esc(fit)}</dd><dt>Color</dt><dd>${esc(color)}</dd><dt>Availability</dt><dd>${x.out?"Sold out":x.stock!=null&&x.stock<=5?"Only "+x.stock+" left":"In stock"}</dd></dl></div>
    <div class="box" id="reviews"><h2>Customer reviews</h2>
      ${n?`<div class="sum"><b>${avg}</b><div><span class="stars">${stars(avg)}</span><span class="meta">Based on ${n} review${n>1?"s":""}</span></div></div>`+revs.map(r=>`<div class="rv">
        <div class="top"><div><b>${esc(r.public_name||"Anonymous")}</b><span class="ver">✔ Verified buyer</span></div><span>${new Date(r.created_at).toLocaleDateString("en-PH",{year:"numeric",month:"short",day:"numeric"})}</span></div>
        <span class="stars">${stars(r.rating)}</span><p>${esc(r.comment)}</p>
        ${r.fit?`<div class="rv-details"><div>Fit: <span>${esc(r.fit)}</span></div></div>`:""}
        ${me&&r.user_id===me.id?`<div class="rv-acts"><button type="button" class="del" data-id="${esc(r.id)}">🗑️ Delete</button></div>`:""}</div>`).join(""):`<p>No reviews yet.</p>`}
      ${form}
    </div>
  </div>`;
  if($("rvForm")&&mine){const r=$("rvForm").querySelector('input[name=rating][value="'+mine.rating+'"]');if(r)r.checked=true;$("rvFit").value=mine.fit||"True to size"}
  seo(x,D,avg,n);
}

document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("#sizes")&&t.dataset.s){size=+t.dataset.s;draw();return}
  if(t.id==="inc"&&qty<Math.min(10,x.stock==null?10:x.stock)){qty++;draw();return}
  if(t.id==="dec"&&qty>1){qty--;draw();return}
  if(t.id==="add"||t.id==="buy"){
    if(!size){toast("Please select a size first");$("sizes").scrollIntoView({block:"center",behavior:"smooth"});return}
    if(t.id==="buy"){location.href="shop.html?"+(x.id!=null?"buyid="+encodeURIComponent(x.id):"buyn="+encodeURIComponent(x.n))+"&size="+size+"&qty="+qty;return}
    const inCart=SNKCart.get().filter(i=>String(i.id)===String(x.id)&&+i.size===size).reduce((s,i)=>s+i.qty,0);
    if(x.stock!=null&&inCart+qty>x.stock){toast("Only "+x.stock+" in stock"+(inCart?" ("+inCart+" already in your cart)":""));return}
    SNKCart.add({id:x.id,n:x.n,b:x.b,img:x.img||"",d:x.d||"",a:x.a||"",s:x.s||"",col:x.col||"",m:x.m,p:x.p,size,qty});
    toast("Added to cart");return;
  }
  if(t.id==="notify"){
    const u=await SNKDB.requireLogin();if(!u)return;
    try{await SNKDB.notify(x.id);toast("Request saved. We'll let you know when it's back.")}catch(_){toast("Couldn't save your request.")}return;
  }
  if(t.classList.contains("del")){delId=t.dataset.id;$("delModal").classList.add("show")}
});
$("confirmCancel").addEventListener("click",()=>$("delModal").classList.remove("show"));
$("confirmDelete").addEventListener("click",async()=>{
  $("delModal").classList.remove("show");
  try{await SNKDB.deleteReview(delId);await loadReviews();toast("Review deleted")}catch(_){toast("Couldn't delete the review")}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="rvForm")return;
  e.preventDefault();
  const md=me.user_metadata||{},nm=((md.first_name||"")+" "+((md.last_name||"")[0]||"")).trim();
  const rating=+(document.querySelector("input[name=rating]:checked")||{}).value;
  try{
    await SNKDB.submitReview(x.id,rating,$("rvFit").value,$("rvComment").value.trim(),$("rvShow").checked?(nm?nm+".":"Customer"):null);
    await loadReviews();toast("Thanks for your review!");
  }catch(ex){$("rvErr").textContent=/NOT_VERIFIED/.test(ex.message||"")?"Only customers with a delivered order can review this pair.":"Couldn't submit your review. Please try again."}
});

async function loadReviews(){
  if(x&&x.id!=null&&SNKDB.ok){
    try{revs=await SNKDB.reviews(x.id)}catch(_){revs=[]}
    const s=await SNKDB.session();me=s?s.user:null;
    canReview=me?await SNKDB.canReview(x.id):false;
  }
  draw();
}
(async()=>{
  $("app").innerHTML='<div class="nf"><p class="meta">Loading…</p></div>';
  if(SNKDB.ok){
    try{const[rows,ratings]=await Promise.all([SNKDB.fetchProducts(),SNKDB.fetchRatings()]);SNKDB.applyToCatalog(P,rows,ratings)}catch(e){console.error(e)}
  }
  x=find();
  await loadReviews();
  if(location.hash==="#reviews"&&$("reviews"))$("reviews").scrollIntoView();
})();
</script>
</body>
</html>
